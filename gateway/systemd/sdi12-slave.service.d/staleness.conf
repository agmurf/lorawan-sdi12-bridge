[Service]
# How old the newest reading may be before the slave answers with the
# -9.999 sentinel instead of a real value.
#
# The EM411 reports every 5 minutes. The 900s default tolerated only two
# consecutive missed uplinks, and at the reception rate measured after
# the move to SF12 that meant a perfectly healthy sensor would sometimes
# read as invalid at the recorder. 1200s tolerates four consecutive
# misses.
#
# This is a deliberate trade, not a loosening: a genuinely dead sensor
# now stays hidden for 20 minutes rather than 15. That is still well
# inside any flood response timeframe, whereas a false invalid on a
# working gauge is both more likely and more corrosive to trust in the
# radio path.
Environment=SDI12_MAX_AGE=1200
