# Added 2026-08-04.
#
# The SX1301 on the RAK2245 is not ready to answer on SPI for up to ~60s after
# a warm reboot. start.sh performs the GPIO17 reset correctly, but systemd's
# default rate limit (5 starts / 10s) was exhausted about 35 seconds into boot,
# so the unit gave up permanently and the site stayed silent until someone
# started it by hand.
#
# StartLimitIntervalSec=0 disables the rate limit entirely: keep retrying
# forever. On an unattended field device, retrying is always better than
# giving up.
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=15
