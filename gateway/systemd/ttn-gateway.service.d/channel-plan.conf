[Unit]
# The field site is unattended: never give up restarting.
StartLimitIntervalSec=0

[Service]
# Re-apply this site LoRa channel plan before every start.
#
# The EM411 here uses AS923 channels 922.0-923.4. The RAK image ships
# 923.2-924.6. The two overlap on only the two AS923-1 defaults, so with
# the stock plan this gateway hears 2 uplinks in 8 -- a measured 25-29%%
# against 93%% once corrected.
#
# global_conf.json belongs to the RAK installer, so an update, reinstall
# or reflash silently restores the stock plan. That failure is invisible:
# the service starts, the logs look healthy, and reception just drops to
# a quarter with nothing pointing at the cause. Enforcing it here makes
# that regression impossible rather than merely unlikely.
ExecStartPre=/usr/bin/python3 /home/pi/channel_plan.py
