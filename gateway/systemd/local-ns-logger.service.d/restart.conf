[Unit]
# Never give up. Systemd's default rate limit (5 starts / 10s) let a
# transient startup failure kill this service PERMANENTLY -- it burned
# five restarts in one second on an ImportError and then refused to try
# again, leaving the flood gateway silently dead until someone noticed.
#
# Same reasoning and same fix as the ttn-gateway drop-in. On an
# unattended field device, retrying forever always beats giving up: a
# service stuck in a restart loop is visible in the logs, one that has
# given up looks identical to one that is merely idle.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=10
