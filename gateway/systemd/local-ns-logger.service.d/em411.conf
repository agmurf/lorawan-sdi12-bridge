[Service]
# Sensor face height above the Fort Denison tide datum, mm.
# A SURVEY value, not the Measurement Range setting in ToolBox.
Environment=EM411_SENSOR_HEIGHT_MM=1946.2
#
# Trustworthy band, metres of river height.
#
# Both bounds are now DERIVED from the hardware. Both of my earlier
# guesses were wrong in the same direction -- too narrow -- and each one
# silently discarded real readings:
#
#   upper: 1946.2 mm sensor height minus the 150 mm radar blind zone
#          = 1796 mm, taken as 1.79 m.
#          Was 1.55 m: wrong by 240 mm, and it began publishing the
#          sentinel partway up a rising tide.
#
#   lower: 1946.2 mm sensor height minus the 2000 mm measurement range
#          = -53.8 mm, taken as -0.054 m. The 2.0 m range was chosen
#          deliberately to leave headroom below the physical floor, so
#          the floor IS the bound -- anything the radar can measure is
#          a real reading.
#          Was 0.35 m: it rejected an entire falling tide sitting at
#          0.30 m, so the ERT-A2 received nothing but -9.999 and sat
#          retransmitting a FROZEN level over the ALERT radio as though
#          it were current. Confirmed off-air by SDR capture.
#
# Treat both as backstops only. The device reports blind_zone_status and
# tilt itself; those guards are authoritative. If they ever disagree
# with this band, believe the device.
Environment=EM411_MIN_M=-0.054
Environment=EM411_MAX_M=1.79
